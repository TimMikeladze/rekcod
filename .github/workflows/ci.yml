name: ci
on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs this whole workflow before it publishes anything.
  workflow_call:
    inputs:
      upload-guest:
        description: Upload out/guest as the `guest` artifact for the caller.
        type: boolean
        default: false

permissions: {}

# A newer push makes the older run's result moot.
concurrency:
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo build --locked -p rekcod
      - run: REKCOD=target/debug/rekcod python3 scripts/e2e-edges.py
      - run: packaging/server/test.sh
      - run: cargo clippy --locked -p rekcod -p rekcod-proto -- -D warnings
      - run: cargo clippy --locked -p rekcod-agent --target aarch64-unknown-linux-musl -- -D warnings
      - run: cargo build --locked --release -p rekcod-agent --target aarch64-unknown-linux-musl

  # Advisories, licenses, duplicate crates and sources (deny.toml).
  deny:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check

  # The web dashboard against fixtures/state.json: no VM, no rekcod binary needed.
  dashboard:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      # Only what ships in the standalone bundle; dev tooling is out of scope.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: dashboard/playwright-report

  guest:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The agent's cfg(target_os = "linux") tests, which the macOS job compiles out.
      - run: cargo test --locked -p rekcod-agent --target aarch64-unknown-linux-musl
      - uses: ./.github/actions/guest
      - if: inputs.upload-guest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guest
          path: out/guest
          retention-days: 7
