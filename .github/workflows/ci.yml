name: ci
on:
  push:
    branches: [main]
  pull_request:

# A newer push makes the older run's result moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test --workspace
      - run: cargo clippy -p rekcod -p rekcod-proto -- -D warnings
      - run: cargo clippy -p rekcod-agent --target aarch64-unknown-linux-musl -- -D warnings
      - run: cargo build --release -p rekcod-agent --target aarch64-unknown-linux-musl

  guest:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      # The compiled guest kernel, reused until guest/kernel, guest/fuse or
      # guest/build.sh changes (guest/build.sh keys its cache the same way).
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kernel-cache
          key: guest-kernel-${{ hashFiles('guest/build.sh', 'guest/kernel/**', 'guest/fuse/**') }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: agent
        run: |
          cargo build --release -p rekcod-agent --target aarch64-unknown-linux-musl
          mkdir -p out/agent && cp target/aarch64-unknown-linux-musl/release/rekcod-agent out/agent/
      - name: guest image
        run: |
          sudo REKCOD_KERNEL_CACHE="$RUNNER_TEMP/kernel-cache" guest/build.sh out/agent/rekcod-agent out/guest
          sudo chown -R "$(id -u):$(id -g)" out/guest "$RUNNER_TEMP/kernel-cache"
          ls -l out/guest
          size=$(stat -c %s out/guest/root.img)
          test "$size" -lt $((400 * 1024 * 1024)) || { echo "root.img too big: $size"; exit 1; }
