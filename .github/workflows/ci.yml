name: ci
on:
  push:
    branches: [main]
  pull_request:
  # bump.yml runs it on the bump/versions branch (its PR can't trigger workflows itself).
  workflow_dispatch:
  # release.yml runs this whole workflow before it publishes anything.
  workflow_call:
    inputs:
      upload-guest:
        description: Upload out/guest as the `guest` artifact for the caller.
        type: boolean
        default: false

permissions: {}

# A newer push makes the older run's result moot.
concurrency:
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      # docs/*.md paths, README sections and anchors that code, scripts and docs point at.
      - run: python3 scripts/check-docs.py
      # Shell scripts parse. The VM suites run only on the self-hosted e2e runner, so a quoting
      # mistake in one would otherwise show up there first.
      - run: git ls-files -z '*.sh' packaging/server/scripts | xargs -0 -n1 bash -n
      - run: cargo test --workspace --locked
      - run: cargo build --locked -p rekcod
      - run: REKCOD=target/debug/rekcod python3 scripts/e2e-edges.py
      # host state and host exec through a stand-in ssh. No VM here, so it takes the stopped
      # branch (REKCOD_NO_BOOT reaches the host); it needs a docker CLI for the host's context.
      - run: command -v docker || brew install docker
      - run: REKCOD=target/debug/rekcod REKCOD_HOME="$RUNNER_TEMP/rekcod-home" scripts/e2e-engines.sh
      - run: python3 -m unittest scripts/test_bump_versions.py
      - run: python3 .github/scripts/check_release_jobs.py
      - run: packaging/server/test.sh
      - run: scripts/test-install.sh
      - run: cargo clippy --locked -p rekcod -p rekcod-proto -- -D warnings
      - run: cargo clippy --locked -p rekcod-agent --target aarch64-unknown-linux-musl -- -D warnings
      - run: cargo build --locked --release -p rekcod-agent --target aarch64-unknown-linux-musl

  # Advisories, licenses, duplicate crates and sources (deny.toml).
  deny:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check

  # The web dashboard against fixtures/state.json: no VM, no rekcod binary needed.
  dashboard:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      # Only what ships in the standalone bundle; dev tooling is out of scope.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: dashboard/playwright-report

  website:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # Mermaid and Astro's runtime are served to visitors.
      - run: bun audit --audit-level=high
      - run: bun test
      - run: bun run typecheck
      - run: bun run build
      - run: bun run check:site
      - run: bun run check:links

  guest:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      # No caches when building the guest a release ships: target/ holds the agent that goes
      # into root.img, and the kernel cache holds the Image.
      - if: ${{ !inputs.upload-guest }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The agent's cfg(target_os = "linux") tests, which the macOS job compiles out.
      - run: cargo test --locked -p rekcod-agent --target aarch64-unknown-linux-musl
      # Builds the image and boots it under QEMU (guest/smoke.sh).
      - uses: ./.github/actions/guest
        with:
          kernel-cache: ${{ !inputs.upload-guest }}
      - if: inputs.upload-guest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guest
          path: out/guest
          retention-days: 7
