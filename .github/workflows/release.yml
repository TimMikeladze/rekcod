name: release
on:
  push:
    tags: ["v*"]

permissions: {}

# Building, signing and publishing are separate jobs: the build runs dependency build
# scripts (cargo, npm) and holds no secrets and no write token; signing holds the Apple
# secrets and runs only codesign, tar, shasum and notarytool; publishing holds the write
# token and the provenance permissions. .github/scripts/check_release_jobs.py (ci.yml)
# fails if a job here mixes a build tool with the signing secrets.
jobs:
  # fmt, clippy, host and agent tests, cargo-deny, dashboard checks, the guest build and
  # its QEMU boot. Nothing is published unless all of it passes. Without caches: the
  # shipped guest holds only what this run compiled.
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      upload-guest: true

  # The VM suites on the self-hosted Mac, with the guest ci just built. Skipped while the
  # REKCOD_E2E_RUNNER variable isn't "true"; a skip blocks the release unless the
  # REKCOD_RELEASE_WITHOUT_E2E variable is "true", and the release notes then say so.
  e2e:
    needs: ci
    if: vars.REKCOD_E2E_RUNNER == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yml
    with:
      guest-artifact: guest

  build:
    needs: [ci, e2e]
    if: >-
      !cancelled() && needs.ci.result == 'success' &&
      (needs.e2e.result == 'success' ||
       (needs.e2e.result == 'skipped' && vars.REKCOD_RELEASE_WITHOUT_E2E == 'true'))
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, for the ancestry check below.
          fetch-depth: 0
      - name: check the tag is on main and matches Cargo.toml
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME isn't on main"; exit 1; }
          test "v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" = "$GITHUB_REF_NAME"
      - uses: ./.github/actions/rust
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-cyclonedx@0.5.9
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: guest
          path: out/guest

      # out/release/stage holds the unsigned binary; the guest tarball is final here, since
      # the binary embeds its sha256.
      - run: GUEST_DIR=out/guest scripts/package.sh build --with-dashboard

      - name: SBOMs (CycloneDX)
        run: |
          v=${GITHUB_REF_NAME#v}
          cargo cyclonedx -q --format json --spec-version 1.5 --target aarch64-apple-darwin --override-filename sbom
          mv crates/rekcod/sbom.json "out/release/rekcod-$v-darwin-arm64.cdx.json"
          cargo cyclonedx -q --format json --spec-version 1.5 --target aarch64-unknown-linux-musl --override-filename sbom
          mv crates/rekcod-agent/sbom.json "out/release/rekcod-agent-$v-linux-arm64.cdx.json"
          rm -f crates/*/sbom.json
          # package.sh's npm ci left dashboard/node_modules in place.
          (cd dashboard && npm sbom --omit=dev --sbom-format cyclonedx) > "out/release/rekcod-dashboard-$v.cdx.json"

      # One tarball: upload-artifact drops file modes, and bin/rekcod must stay executable.
      - run: tar -C out -cf "$RUNNER_TEMP/unsigned.tar" release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned
          path: ${{ runner.temp }}/unsigned.tar
          retention-days: 3

  sign:
    needs: build
    if: "!cancelled() && needs.build.result == 'success'"
    runs-on: macos-15
    # Holds the Apple secrets (Settings > Environments > release, limited to v* tags).
    environment: release
    permissions:
      contents: read
    env:
      # Developer ID signing and notarization run only when every secret is set. Without
      # them the binary is ad-hoc signed.
      HAVE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID_P12 != '' && secrets.APPLE_DEVELOPER_ID_P12_PASSWORD != '' && secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned
          path: ${{ runner.temp }}
      - run: mkdir -p out && tar -C out -xf "$RUNNER_TEMP/unsigned.tar"

      - name: Developer ID keychain
        if: env.HAVE_DEVELOPER_ID == 'true'
        env:
          P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/rekcod-signing.keychain-db"
          kc_pass=$(openssl rand -hex 24)
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          # Lets codesign use the key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$kc" >/dev/null
          # codesign searches the user's keychain list; put ours first.
          existing=$(security list-keychains -d user | tr -d '"' | xargs)
          # shellcheck disable=SC2086 # one path per word
          security list-keychains -d user -s "$kc" $existing
          id=$(security find-identity -v -p codesigning "$kc" | awk '/Developer ID Application/ { print $2; exit }')
          test -n "$id" || { echo "no Developer ID Application identity in APPLE_DEVELOPER_ID_P12"; exit 1; }
          echo "CODESIGN_IDENTITY=$id" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$kc" >> "$GITHUB_ENV"

      # Signs with $CODESIGN_IDENTITY when the step above set it, ad-hoc otherwise; then the
      # host tarballs and SHA256SUMS.
      - run: scripts/package.sh sign

      # A bare binary can't be stapled: Gatekeeper looks the ticket up online on first run.
      # notarytool takes a zip, so the binary from the tarball goes in one; the tarball and
      # SHA256SUMS stay as they are.
      - name: notarize
        if: env.HAVE_DEVELOPER_ID == 'true'
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          n="$RUNNER_TEMP/notarize"
          mkdir -p "$n"
          printf '%s\n' "$API_KEY_P8" > "$n/AuthKey.p8"
          tar -xzf out/release/rekcod-darwin-arm64.tar.gz -C "$n" bin/rekcod
          codesign --verify --strict --verbose=2 "$n/bin/rekcod"
          codesign -d --verbose=2 "$n/bin/rekcod" 2>&1 | grep -q 'flags=.*runtime' || { echo "hardened runtime missing"; exit 1; }
          ditto -c -k --keepParent "$n/bin/rekcod" "$n/rekcod.zip"
          xcrun notarytool submit "$n/rekcod.zip" --key "$n/AuthKey.p8" --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER_ID" --wait --timeout 30m --output-format json | tee "$n/result.json"
          status=$(jq -r .status "$n/result.json")
          if [ "$status" != Accepted ]; then
            xcrun notarytool log "$(jq -r .id "$n/result.json")" --key "$n/AuthKey.p8" \
              --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" || true
            echo "notarization: $status"
            exit 1
          fi
          rm -f "$n/AuthKey.p8"

      - name: remove signing keychain
        if: always() && env.SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$SIGNING_KEYCHAIN"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: out/release
          retention-days: 3

  publish:
    needs: [e2e, sign]
    if: "!cancelled() && needs.sign.result == 'success'"
    runs-on: ubuntu-24.04
    permissions:
      contents: write # gh release create
      id-token: write # provenance: Sigstore signing
      attestations: write # provenance: store the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: out/release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/release/*
      - env:
          GH_TOKEN: ${{ github.token }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          : >"$RUNNER_TEMP/notes.md"
          if [ "$E2E_RESULT" != success ]; then
            echo "The VM suites (e2e.yml) didn't run for this release. Its guest passed the QEMU boot check only." >"$RUNNER_TEMP/notes.md"
          fi
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" out/release/* \
            --generate-notes --notes-file "$RUNNER_TEMP/notes.md"
