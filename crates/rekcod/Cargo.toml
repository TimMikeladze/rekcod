[package]
name = "rekcod"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Docker on macOS, switched in one command"

[dependencies]
rekcod-proto.workspace = true
tokio.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
socket2 = { version = "0.6", features = ["all"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-virtualization = { version = "0.3", features = ["dispatch2", "objc2-app-kit"] }
block2 = "0.6"
dispatch2 = "0.3"
notify = "8"
rusqlite = { version = "0.37", features = ["bundled"] }
hmac = "0.12"
sha2 = "0.11"
aes-gcm = "0.10"
zstd = "0.13"
objc2-app-kit = "0.3"
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
http-body-util = "0.1"
bytes = "1"
governor = "0.10"
ipnet = "2"
smoltcp = { version = "0.14", default-features = false, features = ["std", "log", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"
